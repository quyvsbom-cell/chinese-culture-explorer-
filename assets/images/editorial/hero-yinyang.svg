<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Nguồn gốc Địa lý - Khí hậu của Âm Dương và Biểu đồ Thái Cực</title>
  <desc>Conceptual diagram tracing Yin-Yang from mountain/river solar topography in Shijing to Daoist philosophy and Neo-Confucian Taijitu.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 03 • VĂN BẢN HỌC &amp; VŨ TRỤ LUẬN CỔ ĐẠI</text>
  <text x="72" y="138" class="h-title">Âm – Dương: Từ Quang chiếu Địa hình đến Phạm trù Triết học</text>
  <text x="72" y="172" class="h-sub">Tiến hóa khái niệm từ 《诗经》 (“Sơn nam thủy bắc”) qua 《道德经》 đến 《周易·系辞》</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Left: Mountain & River Topographical Origin -->
  <g transform="translate(72, 230)">
    <rect width="840" height="585" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.6"/>
    <text x="32" y="44" class="label-b">I. NGỮ NGHĨA GỐC ĐỊA LÝ HỌC CỔ ĐẠI (KINH THI • THẾ KỶ X–VII TCN)</text>
    <text x="32" y="68" class="label-s">Định hướng theo Mặt Trời phương Nam ở bán cầu Bắc: Dương = hướng nắng; Âm = khuất nắng</text>

    <!-- Sun rays -->
    <circle cx="725" cy="145" r="42" fill="#B99A62" opacity="0.28"/>
    <circle cx="725" cy="145" r="24" fill="#B63D32"/>
    <text x="725" y="102" text-anchor="middle" class="label-s" font-weight="700" fill="#B63D32">Mặt Trời (Hướng Nam 南)</text>
    <line x1="690" y1="170" x2="540" y2="290" stroke="#B99A62" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="705" y1="185" x2="620" y2="345" stroke="#B99A62" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Mountain Silhouette -->
    <polygon points="105,360 320,165 545,360" fill="#D5CCB6"/>
    <polygon points="105,360 320,165 320,360" fill="#3B3832" opacity="0.88"/>
    <text x="218" y="295" text-anchor="middle" class="han" font-size="28" fill="#F7F4ED">山北为阴</text>
    <text x="218" y="325" text-anchor="middle" class="label-s" fill="#EEE9DE">Sườn Bắc khuất nắng = Âm</text>
    <text x="422" y="295" text-anchor="middle" class="han" font-size="28" fill="#9F2929">山南为阳</text>
    <text x="422" y="325" text-anchor="middle" class="label-s" fill="#202020">Sườn Nam đón nắng = Dương</text>
    <text x="195" y="395" text-anchor="middle" class="label-s" font-weight="700">Ví dụ: 华阴 (Hoa Âm)</text>

    <!-- River Cross-section -->
    <rect x="90" y="438" width="660" height="44" fill="#637F72" opacity="0.32" stroke="#637F72"/>
    <text x="420" y="466" text-anchor="middle" class="label-b" fill="#3F574D">DÒNG SÔNG ĐÔNG–TÂY (Sông Lạc / Hoàng Hà)</text>
    <text x="250" y="425" text-anchor="middle" class="label-s" font-weight="700" fill="#9F2929">Bờ Bắc đón nắng Nam = Dương (洛阳 Lạc Dương)</text>
    <text x="585" y="512" text-anchor="middle" class="label-s" font-weight="700">Bờ Nam khuất nắng = Âm (淮阴 Hoài Âm)</text>
    <rect x="32" y="528" width="776" height="38" rx="4" fill="#F7F4ED" stroke="#DED8CA"/>
    <text x="420" y="552" text-anchor="middle" class="label-s">《诗经·大雅》: “相其阴阳，观其流泉” — Khảo sát hướng nắng và mạch nước trước khi lập ấp</text>
  </g>

  <!-- Right: Relational Philosophy & Taiji Symbol -->
  <g transform="translate(946, 230)">
    <rect width="582" height="585" rx="8" fill="#FBF8F1" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="30" y="44" class="label-b">II. MÔ HÌNH QUAN HỆ (RELATIONAL THINKING)</text>
    <g transform="translate(291, 215)">
      <circle r="115" fill="#F7F4ED" stroke="#202020" stroke-width="3"/>
      <path d="M0,-115 A115,115 0 0,1 0,115 A57.5,57.5 0 0,1 0,0 A57.5,57.5 0 0,0 0,-115 Z" fill="#202020"/>
      <circle cy="-57.5" r="14" fill="#202020"/>
      <circle cy="57.5" r="14" fill="#F7F4ED"/>
    </g>
    <text x="291" y="362" text-anchor="middle" class="han-big" font-size="24">一阴一阳之谓道</text>
    <g transform="translate(32, 392)">
      <rect width="518" height="50" rx="5" fill="#EEE9DE"/>
      <text x="16" y="30" class="label-s"><strong>1. Tương đối luận:</strong> Vạn vật không bất biến hoàn toàn Âm hay Dương</text>
      <rect y="62" width="518" height="50" rx="5" fill="#EEE9DE"/>
      <text x="16" y="92" class="label-s"><strong>2. Chuyển hóa (物极必反):</strong> Âm cực sinh Dương, Dương cực sinh Âm</text>
      <rect y="124" width="518" height="50" rx="5" fill="#EEE9DE" stroke="#637F72"/>
      <text x="16" y="154" class="label-s"><strong>3. Ranh giới Khoa học:</strong> Là triết lý &amp; ngôn ngữ Đông y, không phải hạt vật lý</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>