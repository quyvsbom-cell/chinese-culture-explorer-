<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Văn hóa Vùng miền: Kinh Phái Bắc Kinh đối chiếu Hải Phái Thượng Hải</title>
  <desc>Architectural and commercial culture duality comparing Beijing&#x27;s imperial Central Axis and Siheyuan with Shanghai&#x27;s Shikumen and Bund.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 12 • ĐỊA LÝ VĂN HÓA &amp; ĐÔ THỊ HỌC SO SÁNH</text>
  <text x="72" y="138" class="h-title">Song thành Ký: Kinh Phái Bắc Kinh (京派) vs Hải Phái Thượng Hải (海派)</text>
  <text x="72" y="172" class="h-sub">Từ hình thái đô thị Tứ Hợp Viện – Thạch Khố Môn đến tâm lý giao tiếp kinh doanh hiện đại</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <g transform="translate(72, 232)">
    <rect width="710" height="585" rx="8" fill="#EEE9DE" stroke="#9F2929" stroke-width="2"/>
    <text x="32" y="46" class="label-b" fill="#9F2929">BẮC KINH — KINH PHÁI (京派)</text>
    <text x="32" y="72" class="label-s">800 năm Kinh đô Đế chế • Trục Trung tâm UNESCO 2024 • Tứ Hợp Viện</text>
    <!-- Siheyuan Plan -->
    <g transform="translate(115, 102)">
      <rect width="480" height="260" fill="#F7F4ED" stroke="#202020" stroke-width="2.5"/>
      <rect x="65" y="16" width="350" height="54" fill="#9F2929"/><text x="240" y="49" text-anchor="middle" class="label-s" fill="#F7F4ED" font-weight="700">Chính phòng (Tọa Bắc triều Nam — Trưởng bối)</text>
      <rect x="18" y="82" width="64" height="120" fill="#B99A62"/><text x="50" y="148" text-anchor="middle" font-size="12" fill="#202020" transform="rotate(-90 50 148)">Tây Sương</text>
      <rect x="398" y="82" width="64" height="120" fill="#B99A62"/><text x="430" y="148" text-anchor="middle" font-size="12" fill="#202020" transform="rotate(90 430 148)">Đông Sương</text>
      <rect x="108" y="88" width="264" height="114" fill="#EEE9DE" stroke="#637F72" stroke-dasharray="4 3"/><text x="240" y="150" text-anchor="middle" class="label-s" fill="#3F574D">Sân trong (Thiên tĩnh 天井) tụ khí</text>
      <rect x="120" y="216" width="240" height="32" fill="#202020"/><text x="240" y="237" text-anchor="middle" font-size="12" fill="#F7F4ED">Đảo tọa &amp; Cổng Đông Nam</text>
    </g>
    <g transform="translate(32, 392)">
      <rect width="646" height="162" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
      <text x="20" y="34" class="label-b">Đặc trưng Giao tiếp &amp; Kinh doanh:</text>
      <text x="20" y="64" class="label-s">• Tôn trọng tầm nhìn vĩ mô (“Đại cục quan” 大局观) &amp; quy hoạch chính sách</text>
      <text x="20" y="92" class="label-s">• Coi trọng danh vị, thứ bậc hành chính và nghi thức tiếp đón trang trọng</text>
      <text x="20" y="120" class="label-s">• Ngôn ngữ: Bắc Kinh nhi âm (儿化音), phóng khoáng, ưa bàn chuyện chính sự – văn hóa</text>
    </g>
  </g>

  <g transform="translate(818, 232)">
    <rect width="710" height="585" rx="8" fill="#FBF8F1" stroke="#224C8A" stroke-width="2"/>
    <text x="32" y="46" class="label-b" fill="#224C8A">THƯỢNG HẢI — HẢI PHÁI (海派)</text>
    <text x="32" y="72" class="label-s">Thương cảng Quốc tế thế kỷ XIX • Bến Thượng Hải &amp; Thạch Khố Môn (石库门)</text>
    <!-- Shikumen & Bund Schematic -->
    <g transform="translate(115, 102)">
      <rect width="480" height="260" fill="#EEE9DE" stroke="#224C8A" stroke-width="2.5"/>
      <!-- Bund Towers Silhouette -->
      <rect x="30" y="70" width="60" height="170" fill="#224C8A" opacity="0.22" stroke="#224C8A"/>
      <rect x="105" y="45" width="75" height="195" fill="#224C8A" opacity="0.28" stroke="#224C8A"/>
      <polygon points="105,45 142,16 180,45" fill="#224C8A"/>
      <rect x="195" y="88" width="85" height="152" fill="#224C8A" opacity="0.18" stroke="#224C8A"/>
      <!-- Shikumen Gate Arch -->
      <rect x="315" y="75" width="135" height="165" fill="#4A453B"/>
      <path d="M342 240 V140 A40 40 0 0 1 422 140 V240 Z" fill="#9F2929" stroke="#F7F4ED" stroke-width="2"/>
      <polygon points="335,120 382,92 430,120" fill="#B99A62"/>
      <text x="150" y="215" text-anchor="middle" font-size="12" fill="#202020" font-weight="700">Ngoại Than (Art Deco)</text>
      <text x="382" y="220" text-anchor="middle" font-size="12" fill="#F7F4ED" font-weight="700">Cổng đá Thạch Khố Môn</text>
    </g>
    <g transform="translate(32, 392)">
      <rect width="646" height="162" rx="6" fill="#EEE9DE" stroke="#224C8A"/>
      <text x="20" y="34" class="label-b" fill="#224C8A">Đặc trưng Giao tiếp &amp; Kinh doanh:</text>
      <text x="20" y="64" class="label-s">• “Khế ước tinh thần” (契约精神): ưu tiên điều khoản hợp đồng, SLA, KPI định lượng</text>
      <text x="20" y="92" class="label-s">• “Phân thốn cảm” (分寸感): rạch ròi công – tư, đúng giờ, tinh gọn và thực dụng</text>
      <text x="20" y="120" class="label-s">• Kết hợp nhà sân Giang Nam + phố liền kề châu Âu; trung tâm tài chính – logistics</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>