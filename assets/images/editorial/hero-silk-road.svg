<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Con đường Tơ lụa Lục địa &amp; Hàng hải Đông Á (陆海丝绸之路)</title>
  <desc>Comparative historical diagram of Overland Silk Road caravan corridors and Maritime Shibosi sea lanes connecting China, Vietnam, and Afro-Eurasia.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 38px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 13.5px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="84" class="kicker">CHƯƠNG 15 • GIAO THƯƠNG Á–ÂU &amp; HẢI THƯƠNG ĐÔNG Á (138 TCN – THẾ KỶ XV)</text>
  <text x="72" y="132" class="h-title">Lục Hải Tơ Lụa: Từ Trương Khiên, Thị Bạc Tư đến Hạm đội Trịnh Hòa</text>
  <text x="72" y="164" class="h-sub">Cấu trúc hai nhánh giao lưu hàng hóa, tôn giáo, công nghệ hàng hải và tiền tệ xuyên lục địa Á–Âu–Phi</text>
  <line x1="72" y1="186" x2="1528" y2="186" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Top Band: Overland Silk Road -->
  <g transform="translate(72, 212)">
    <rect width="1456" height="274" rx="8" fill="#EFECE2" stroke="#B99A62" stroke-width="1.6"/>
    <rect width="1456" height="44" rx="8" fill="url(#goldGrad)"/>
    <text x="24" y="28" class="label-b" fill="#202020">I. CON ĐƯỜNG TƠ LỤA LỤC ĐỊA (陆上丝绸之路 • 138 TCN – NHÀ NGUYÊN)</text>
    <text x="1430" y="28" text-anchor="end" class="han" font-size="15" fill="#202020">张骞凿空 • 河西走廊 • 敦煌莫高窟</text>

    <!-- Mountain Ridge Decoration -->
    <path d="M40 220 L160 155 L290 210 L420 140 L570 215 L720 160 L880 215 L1060 150 L1220 212 L1410 220" fill="none" stroke="#C5B99F" stroke-width="2" opacity="0.6"/>

    <!-- Route line -->
    <path d="M130 132 L410 132 L680 112 L970 132 L1270 115" fill="none" stroke="#9F2929" stroke-width="4" stroke-dasharray="10 5" marker-end="url(#arrowRed)"/>

    <!-- Nodes -->
    <g transform="translate(130, 132)">
      <circle r="16" fill="#9F2929" stroke="#F7F4ED" stroke-width="3"/>
      <text y="36" text-anchor="middle" class="label-b">Trường An (长安)</text>
      <text y="55" text-anchor="middle" class="label-s">Kinh đô Hán – Đường</text>
    </g>
    <g transform="translate(410, 132)">
      <circle r="13" fill="#B99A62" stroke="#202020" stroke-width="2"/>
      <text y="34" text-anchor="middle" class="label-b">Hành lang Hà Tây</text>
      <text y="53" text-anchor="middle" class="label-s">Lương Châu • Gia Dục Quan</text>
    </g>
    <g transform="translate(680, 112)">
      <circle r="15" fill="#B63D32" stroke="#F7F4ED" stroke-width="2.5"/>
      <text y="38" text-anchor="middle" class="label-b">Đôn Hoàng (敦煌)</text>
      <text y="57" text-anchor="middle" class="label-s">Giao điểm Nam–Bắc Thiên Sơn</text>
    </g>
    <g transform="translate(970, 132)">
      <circle r="13" fill="#B99A62" stroke="#202020" stroke-width="2"/>
      <text y="34" text-anchor="middle" class="label-b">Samarkand (撒马尔罕)</text>
      <text y="53" text-anchor="middle" class="label-s">Thương nhân Túc Đặc (Sogdia)</text>
    </g>
    <g transform="translate(1285, 115)">
      <circle r="15" fill="#202020" stroke="#B99A62" stroke-width="2"/>
      <text y="38" text-anchor="middle" class="label-b">Ba Tư &amp; Địa Trung Hải</text>
      <text y="57" text-anchor="middle" class="label-s">Antioch • Constantinople • Rome</text>
    </g>

    <!-- Goods exchange footer -->
    <rect x="24" y="218" width="1408" height="42" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
    <text x="44" y="244" class="label-s"><tspan font-weight="700" fill="#9F2929">Trao đổi Đông → Tây:</tspan> Tơ lụa, giấy Tuyên, kỹ thuật ấn loát, la bàn, thuốc súng   |   <tspan font-weight="700" fill="#2D4A3E">Tây → Đông:</tspan> Nho, hồ đào, ngựa Thiên mã, thủy tinh, Phật giáo, Hồi giáo</text>
  </g>

  <!-- Bottom Band: Maritime Silk Road -->
  <g transform="translate(72, 514)">
    <rect width="1456" height="306" rx="8" fill="#EAEFEF" stroke="#637F72" stroke-width="1.6"/>
    <rect width="1456" height="44" rx="8" fill="url(#jadeGrad)"/>
    <text x="24" y="28" class="label-b" fill="#F7F4ED">II. CON ĐƯỜNG TƠ LỤA HÀNG HẢI (海上丝绸之路 • ĐƯỜNG – TỐNG – MINH)</text>
    <text x="1430" y="28" text-anchor="end" class="han" font-size="15" fill="#F7F4ED">市舶司 • 泉州刺桐港 • 郑和下西洋</text>

    <!-- Wave pattern -->
    <path d="M40 232 Q110 212 180 232 T320 232 T460 232 T600 232 T740 232 T880 232 T1020 232 T1160 232 T1300 232 T1410 232" fill="none" stroke="#9CB4AB" stroke-width="2.2"/>

    <!-- Route curve -->
    <path d="M135 128 Q390 165 590 130 T980 142 T1290 120" fill="none" stroke="#2D4A3E" stroke-width="4.5" marker-end="url(#arrowJade)"/>

    <!-- Ports -->
    <g transform="translate(135, 128)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#9F2929" stroke="#F7F4ED" stroke-width="2.5"/>
      <text y="34" text-anchor="middle" class="label-b">Tuyền Châu &amp; Quảng Châu</text>
      <text y="53" text-anchor="middle" class="label-s">Cơ quan Thị Bạc Tư (市舶司)</text>
    </g>
    <g transform="translate(465, 144)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#637F72" stroke="#F7F4ED" stroke-width="2.5"/>
      <text y="34" text-anchor="middle" class="label-b">Vân Đồn &amp; Hội An (Đại Việt)</text>
      <text y="53" text-anchor="middle" class="label-s">Trung chuyển gốm Chu Đậu – Thanh Hoa</text>
    </g>
    <g transform="translate(795, 134)">
      <circle r="13" fill="#B99A62" stroke="#202020" stroke-width="2"/>
      <text y="34" text-anchor="middle" class="label-b">Eo Malacca (马六甲)</text>
      <text y="53" text-anchor="middle" class="label-s">Điểm đợi gió mùa Đông Bắc / Tây Nam</text>
    </g>
    <g transform="translate(1065, 142)">
      <circle r="13" fill="#637F72" stroke="#202020" stroke-width="2"/>
      <text y="34" text-anchor="middle" class="label-b">Calicut &amp; Hormuz</text>
      <text y="53" text-anchor="middle" class="label-s">Trạm hải hành Trịnh Hòa (1405–1433)</text>
    </g>
    <g transform="translate(1310, 120)">
      <circle r="14" fill="#202020" stroke="#B99A62" stroke-width="2"/>
      <text y="34" text-anchor="middle" class="label-b">Đông Phi (Malindi)</text>
      <text y="53" text-anchor="middle" class="label-s">Sứ Tống–Minh khai quật tại Kenya</text>
    </g>

    <!-- Bottom analytical note -->
    <rect x="24" y="246" width="1260" height="44" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
    <text x="44" y="273" class="label-s"><tspan font-weight="700" fill="#2D4A3E">Đột phá công nghệ Tống–Minh:</tspan> Vách ngăn chống chìm (水密隔舱), bánh lái trục dọc, la bàn từ (罗盘) giúp thuyền buôn chuyển dịch từ tơ lụa dễ hỏng sang gốm sứ &amp; trà số lượng lớn.</text>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>