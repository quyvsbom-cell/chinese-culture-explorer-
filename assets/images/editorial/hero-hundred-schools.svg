<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Bách Gia Chư Tử - Học viện Tắc Hạ và Thẻ tre Quách Điếm</title>
  <desc>Editorial reconstruction of the Jixia Academy intellectual debate hub and Warring States Guodian bamboo slips.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 01 • AXIAL AGE • 770–221 TCN</text>
  <text x="72" y="138" class="h-title">Bách Gia Chư Tử: Thị trường Ý tưởng Học viện Tắc Hạ &amp; Thẻ tre Quách Điếm</text>
  <text x="72" y="172" class="h-sub">Từ phân quyền đa cực Chiến Quốc đến “Cửu lưu thập gia” trong 《汉书·艺文志》</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Left: Jixia Academy Architectural Pavilion -->
  <g transform="translate(72, 232)">
    <rect width="740" height="585" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.6"/>
    <text x="32" y="46" class="label-b">I. HỌC VIỆN TẮC HẠ NƯỚC TỀ (稷下学宫 • LÂM TRUY)</text>
    <text x="32" y="72" class="label-s">Trung tâm học thuật được nhà nước tài trợ bổng lộc tự do tranh biện (thế kỷ IV–III TCN)</text>

    <!-- Stylized Traditional Hall -->
    <path d="M90 285 Q370 140 650 285 L620 295 Q370 175 120 295 Z" fill="#9F2929"/>
    <path d="M135 280 Q370 185 605 280 Z" fill="#202020"/>
    <rect x="170" y="295" width="400" height="175" fill="#F7F4ED" stroke="#4A453B" stroke-width="2"/>
    <rect x="195" y="295" width="22" height="175" fill="#9F2929"/>
    <rect x="295" y="295" width="22" height="175" fill="#9F2929"/>
    <rect x="423" y="295" width="22" height="175" fill="#9F2929"/>
    <rect x="523" y="295" width="22" height="175" fill="#9F2929"/>
    <rect x="120" y="470" width="500" height="24" fill="#D5CCB6" stroke="#7D7462"/>
    <rect x="95" y="494" width="550" height="24" fill="#C4B99E" stroke="#7D7462"/>
    <text x="370" y="375" text-anchor="middle" class="han-big" font-size="38">百家争鸣</text>
    <text x="370" y="410" text-anchor="middle" class="label-s">Mạnh Tử • Tuân Tử • Trâu Diễn • Thận Đáo đồng thời giảng học</text>
    <rect x="40" y="532" width="660" height="34" rx="4" fill="#F7F4ED" stroke="#DED8CA"/>
    <text x="370" y="554" text-anchor="middle" class="label-s">Nguyên tắc: “Bất trị nhi nghị luận” (不治而议论) — không giữ chức vụ hành chính gò bó</text>
  </g>

  <!-- Right: Guodian Bamboo Slips & 6 Major Schools -->
  <g transform="translate(848, 232)">
    <rect width="680" height="275" rx="8" fill="#FBF8F1" stroke="#637F72" stroke-width="1.6"/>
    <text x="28" y="40" class="label-b">II. THẺ TRE QUÁCH ĐIẾM (郭店楚简 • ~300 TCN)</text>
    <text x="28" y="64" class="label-s">Phát hiện năm 1993 tại Kinh Môn, Hồ Bắc — văn bản Nho &amp; Đạo nằm chung một mộ cổ</text>
    <g transform="translate(36, 90)">
      <rect x="0" y="0" width="52" height="158" rx="4" fill="#E3D4AD" stroke="#9E8450"/>
      <text x="26" y="34" text-anchor="middle" class="han" font-size="22" fill="#202020">太</text>
      <text x="26" y="68" text-anchor="middle" class="han" font-size="22" fill="#202020">一</text>
      <text x="26" y="102" text-anchor="middle" class="han" font-size="22" fill="#202020">生</text>
      <text x="26" y="136" text-anchor="middle" class="han" font-size="22" fill="#202020">水</text>

      <rect x="74" y="0" width="52" height="158" rx="4" fill="#DFCEA3" stroke="#9E8450"/>
      <text x="100" y="34" text-anchor="middle" class="han" font-size="22" fill="#202020">老</text>
      <text x="100" y="68" text-anchor="middle" class="han" font-size="22" fill="#202020">子</text>
      <text x="100" y="102" text-anchor="middle" class="han" font-size="22" fill="#202020">甲</text>
      <text x="100" y="136" text-anchor="middle" class="han" font-size="22" fill="#202020">本</text>

      <rect x="148" y="0" width="52" height="158" rx="4" fill="#E6D8B4" stroke="#9E8450"/>
      <text x="174" y="34" text-anchor="middle" class="han" font-size="22" fill="#202020">缁</text>
      <text x="174" y="68" text-anchor="middle" class="han" font-size="22" fill="#202020">衣</text>
      <text x="174" y="102" text-anchor="middle" class="han" font-size="22" fill="#202020">篇</text>
      <text x="174" y="136" text-anchor="middle" class="han" font-size="22" fill="#9F2929">儒</text>

      <rect x="222" y="0" width="52" height="158" rx="4" fill="#DFCEA3" stroke="#9E8450"/>
      <text x="248" y="34" text-anchor="middle" class="han" font-size="22" fill="#202020">性</text>
      <text x="248" y="68" text-anchor="middle" class="han" font-size="22" fill="#202020">自</text>
      <text x="248" y="102" text-anchor="middle" class="han" font-size="22" fill="#202020">命</text>
      <text x="248" y="136" text-anchor="middle" class="han" font-size="22" fill="#202020">出</text>

      <rect x="300" y="12" width="310" height="134" rx="6" fill="#F2EDE1" stroke="#DED8CA"/>
      <text x="320" y="42" class="label-b">Ý nghĩa Khảo cổ Học thuật:</text>
      <text x="320" y="70" class="label-s">• Bác bỏ giả thuyết Đạo-Nho thù địch tuyệt đối sớm</text>
      <text x="320" y="96" class="label-s">• Văn bản Đạo Đức Kinh cổ hơn bản Vương Bật ~500 năm</text>
      <text x="320" y="122" class="label-s">• Lưu trữ tại Bảo tàng Kinh Môn, Hồ Bắc</text>
    </g>
  </g>

  <g transform="translate(848, 532)">
    <rect width="680" height="285" rx="8" fill="#FBF8F1" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="28" y="40" class="label-b">III. LỤC GIA YẾU CHỈ (TƯ MÃ ĐÀM) &amp; TRỤC TRANH BIỆN</text>
    <g transform="translate(28, 62)">
      <rect x="0" y="0" width="198" height="92" rx="6" fill="#9F2929" opacity="0.09" stroke="#9F2929"/>
      <text x="14" y="28" class="label-b" fill="#9F2929">儒家 • Nho gia</text>
      <text x="14" y="54" class="label-s">Nhân (仁) &amp; Lễ (礼)</text>
      <text x="14" y="76" class="label-s">Khổng – Mạnh – Tuân</text>

      <rect x="212" y="0" width="198" height="92" rx="6" fill="#637F72" opacity="0.12" stroke="#637F72"/>
      <text x="226" y="28" class="label-b" fill="#3F574D">道家 • Đạo gia</text>
      <text x="226" y="54" class="label-s">Tự nhiên &amp; Vô vi (无为)</text>
      <text x="226" y="76" class="label-s">Lão Tử – Trang Tử</text>

      <rect x="424" y="0" width="198" height="92" rx="6" fill="#202020" opacity="0.07" stroke="#202020"/>
      <text x="438" y="28" class="label-b">法家 • Pháp gia</text>
      <text x="438" y="54" class="label-s">Pháp – Thuật – Thế</text>
      <text x="438" y="76" class="label-s">Thương Ưởng – Hàn Phi</text>

      <rect x="0" y="108" width="198" height="92" rx="6" fill="#B99A62" opacity="0.15" stroke="#B99A62"/>
      <text x="14" y="136" class="label-b">墨家 • Mặc gia</text>
      <text x="14" y="162" class="label-s">Kiêm ái (兼爱) &amp; Phi công</text>
      <text x="14" y="184" class="label-s">Logic &amp; Kỹ thuật thủ thành</text>

      <rect x="212" y="108" width="198" height="92" rx="6" fill="#224C8A" opacity="0.09" stroke="#224C8A"/>
      <text x="226" y="136" class="label-b" fill="#224C8A">名家 • Danh gia</text>
      <text x="226" y="162" class="label-s">Danh thực (名实)</text>
      <text x="226" y="184" class="label-s">Công Tôn Long – Huệ Thi</text>

      <rect x="424" y="108" width="198" height="92" rx="6" fill="#EEE9DE" stroke="#B99A62"/>
      <text x="438" y="136" class="label-b">阴阳家 • Âm Dương</text>
      <text x="438" y="162" class="label-s">Ngũ Đức Chung Thủy</text>
      <text x="438" y="184" class="label-s">Trâu Diễn (Tắc Hạ)</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>