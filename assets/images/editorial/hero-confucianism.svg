<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Nho gia và Cấu trúc Xã hội Đông Á - Văn Miếu và Sai tự Cách cục</title>
  <desc>Architecture of Confucian institutions (Dacheng Hall) paired with Fei Xiaotong&#x27;s concentric Chaxu Geju rings.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 02 • TRIẾT HỌC &amp; XÃ HỘI HỌC LỊCH SỬ</text>
  <text x="72" y="138" class="h-title">Nho gia: Từ Định chế Lễ giáo Văn Miếu đến “Sai tự Cách cục”</text>
  <text x="72" y="172" class="h-sub">Ba lần tái cấu trúc: Tiên Tần Nho học • Hán Nho Kinh học • Tống-Minh Lý học &amp; Thể chế Khoa cử</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Left: Concentric Chaxu Geju Diagram -->
  <g transform="translate(72, 228)">
    <rect width="740" height="590" rx="8" fill="#FBF8F1" stroke="#B99A62" stroke-width="1.6"/>
    <text x="32" y="44" class="label-b">I. MÔ HÌNH “SAI TỰ CÁCH CỤC” (差序格局 – PHÍ HIẾU THÔNG, 1947)</text>
    <text x="32" y="68" class="label-s">Vòng tròn đồng tâm tỏa ra từ cá nhân (khác mô hình hợp đồng nguyên tử phương Tây)</text>
    <g transform="translate(370, 325)">
      <circle r="218" fill="#EEE9DE" stroke="#DED8CA" stroke-width="2" stroke-dasharray="7 5"/>
      <circle r="168" fill="#E6DEC9" stroke="#B99A62" stroke-width="2"/>
      <circle r="118" fill="#DFD1B0" stroke="#9F2929" stroke-width="2" stroke-dasharray="4 3"/>
      <circle r="68" fill="#9F2929" opacity="0.16" stroke="#9F2929" stroke-width="2.5"/>
      <circle r="32" fill="#9F2929"/>
      <text y="6" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">己</text>
      <text y="-46" text-anchor="middle" class="label-s" font-weight="700" fill="#9F2929">Gia đình Cốt lõi (家)</text>
      <text y="-96" text-anchor="middle" class="label-s">Tông tộc &amp; Thân thích (亲属)</text>
      <text y="-144" text-anchor="middle" class="label-s">Đồng hương &amp; Sư môn (同乡 • 同门)</text>
      <text y="-194" text-anchor="middle" class="label-s">Xã hội Rộng lớn &amp; Thiên hạ (天下)</text>
      <text y="242" text-anchor="middle" class="label-s" font-style="italic">Nghĩa vụ Ngũ luân (五伦) biến thiên theo độ thân sơ đồng tâm</text>
    </g>
  </g>

  <!-- Right: Institutional Pillars & 3 Waves -->
  <g transform="translate(848, 228)">
    <rect width="680" height="590" rx="8" fill="#EEE9DE" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="30" y="44" class="label-b">II. BA LẦN TÁI CẤU TRÚC &amp; THIẾT CHẾ KHẢO THÍ</text>
    <g transform="translate(30, 74)">
      <rect width="620" height="106" rx="6" fill="#F7F4ED" stroke="#9F2929"/>
      <text x="20" y="34" class="label-b" fill="#9F2929">1. Tiên Tần Nho học (551–221 TCN)</text>
      <text x="20" y="60" class="label-s">Khổng Tử mở rộng chữ “Quân tử” từ dòng dõi quý tộc thành phẩm chất tu dưỡng;</text>
      <text x="20" y="84" class="label-s">Mạnh Tử phát triển thuyết Tính Thiện &amp; Tứ đoan; Tuân Tử nhấn mạnh Lễ và giáo hóa.</text>

      <rect y="124" width="620" height="106" rx="6" fill="#F7F4ED" stroke="#B99A62"/>
      <text x="20" y="158" class="label-b">2. Hán Nho Kinh học (140 TCN – thế kỷ III)</text>
      <text x="20" y="184" class="label-s">Đổng Trọng Thư (“Độc tôn Nho thuật”) kết nối Nho giáo với vũ trụ luận Âm Dương Ngũ Hành,</text>
      <text x="20" y="208" class="label-s">thành lập Thái Học (太学) và hệ thống Sát cử tuyển chọn quan lại theo Ngũ Kinh.</text>

      <rect y="248" width="620" height="106" rx="6" fill="#F7F4ED" stroke="#637F72"/>
      <text x="20" y="282" class="label-b" fill="#3F574D">3. Tống – Minh Lý học &amp; Khoa cử (thế kỷ XI–XIX)</text>
      <text x="20" y="308" class="label-s">Chu Hy chú giải bộ Tứ Thư làm giáo trình khoa cử (1313–1905);</text>
      <text x="20" y="332" class="label-s">Vương Dương Minh đề xuất “Tri hành hợp nhất” và “Trí lương tri”.</text>

      <rect y="374" width="620" height="114" rx="6" fill="#202020"/>
      <text x="24" y="408" class="han" font-size="22" fill="#B99A62">文庙与科举制度 • Khổng Miếu &amp; Bia Tiến sĩ</text>
      <text x="24" y="438" class="label-s" fill="#F7F4ED">Lan tỏa khắp Sinosphere: Văn Miếu Khúc Phụ, Quốc Tử Giám Bắc Kinh &amp;</text>
      <text x="24" y="464" class="label-s" fill="#F7F4ED">Văn Miếu – Quốc Tử Giám Hà Nội (82 Bia Tiến sĩ được UNESCO công nhận Di sản Tư liệu).</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>