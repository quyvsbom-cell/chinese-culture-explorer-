<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Khái niệm Quan hệ (Guanxi) trong Kinh doanh Trung Quốc Hiện đại</title>
  <desc>Sociological architecture diagram showing Guanxi components (Xinyong, Renqing, Mianzi) vs Peng &amp; Luo / Guthrie institutional compliance.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 09 • KINH DOANH QUỐC TẾ &amp; XÃ HỘI HỌC KINH TẾ</text>
  <text x="72" y="138" class="h-title">Guanxi (关系): Cấu trúc Xã hội học vs Quy chuẩn Hợp đồng Hiện đại</text>
  <text x="72" y="172" class="h-sub">Giải cấu trúc ba trụ cột: Tín nhiệm (信用) • Nhân tình (人情) • Thể diện (面子) và giới hạn pháp lý</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <g transform="translate(72, 228)">
    <rect width="740" height="590" rx="8" fill="#FBF8F1" stroke="#B99A62" stroke-width="1.6"/>
    <text x="32" y="44" class="label-b">I. KIẾN TRÚC TAM GIÁC CỦA QUAN HỆ THỰC CHẤT (关系结构)</text>
    <g transform="translate(370, 325)">
      <polygon points="0,-165 215,135 -215,135" fill="#EEE9DE" stroke="#B99A62" stroke-width="2.5"/>
      <circle cy="-165" r="56" fill="#9F2929"/><text y="-168" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">信用</text><text y="-144" text-anchor="middle" font-size="13" fill="#F7F4ED">Tín nhiệm (Xinyong)</text>
      <circle cx="215" cy="135" r="56" fill="#637F72"/><text x="215" y="132" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">人情</text><text x="215" y="156" text-anchor="middle" font-size="13" fill="#F7F4ED">Nhân tình (Renqing)</text>
      <circle cx="-215" cy="135" r="56" fill="#202020"/><text x="-215" y="132" text-anchor="middle" class="han" font-size="22" fill="#B99A62" font-weight="700">面子</text><text x="-215" y="156" text-anchor="middle" font-size="13" fill="#F7F4ED">Thể diện (Mianzi)</text>
      <rect x="-112" y="-10" width="224" height="58" rx="6" fill="#F7F4ED" stroke="#9F2929"/>
      <text y="16" text-anchor="middle" class="label-b" fill="#9F2929">Cơ sở Chia sẻ Chung</text>
      <text y="36" text-anchor="middle" font-size="13" fill="#524F49">Đồng hương • Đồng học • Đồng sự</text>
    </g>
    <text x="370" y="556" text-anchor="middle" class="label-s">Guanxi KHÔNG đồng nghĩa hối lộ: là vốn xã hội giảm chi phí giao dịch &amp; thông tin bất đối xứng</text>
  </g>

  <g transform="translate(848, 228)">
    <rect width="680" height="590" rx="8" fill="#EEE9DE" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="30" y="44" class="label-b">II. PHÂN HÓA THỰC CHỨNG TRONG KINH DOANH THẾ KỶ XXI</text>
    <g transform="translate(30, 74)">
      <rect width="620" height="150" rx="6" fill="#F7F4ED" stroke="#637F72"/>
      <text x="20" y="34" class="label-b" fill="#3F574D">Khu vực Giảm Phụ thuộc Guanxi (Guthrie, 1998)</text>
      <text x="20" y="64" class="label-s">• Sàn TMĐT B2B/B2C minh bạch KPI, đấu thầu công khai &amp; tập đoàn FDI</text>
      <text x="20" y="92" class="label-s">• Đô thị dịch vụ tài chính – cảng biển (Thượng Hải, Thâm Quyến): ưu tiên</text>
      <text x="20" y="118" class="label-s">  năng lực giá, SLA giao hàng, chứng nhận ISO và khế ước pháp lý chặt chẽ.</text>

      <rect y="168" width="620" height="150" rx="6" fill="#F7F4ED" stroke="#B99A62"/>
      <text x="20" y="202" class="label-b">Vai trò Bổ trợ Có Điều kiện (Peng &amp; Luo, 2000)</text>
      <text x="20" y="232" class="label-s">• Xếp lịch ưu tiên chuyền OEM/ODM mùa cao điểm tại Chiết Giang – Quảng Đông</text>
      <text x="20" y="260" class="label-s">• Thăm dò thông tin thị trường địa phương &amp; xử lý sự cố chuỗi cung ứng bất ngờ</text>
      <text x="20" y="288" class="label-s">• Trọng tính liên tục nhân sự phụ trách đàm phán giữa hai doanh nghiệp</text>

      <rect y="336" width="620" height="150" rx="6" fill="#202020"/>
      <text x="20" y="370" class="label-b" fill="#9F2929">Ranh giới Pháp lý &amp; Tuân thủ (Từ 2012–Nay)</text>
      <text x="20" y="400" class="label-s" fill="#F7F4ED">Quy định kiểm toán nội bộ doanh nghiệp niêm yết &amp; luật chống tham nhũng</text>
      <text x="20" y="428" class="label-s" fill="#F7F4ED">nghiêm cấm quà tặng vượt mức hoặc chi hoa hồng ngoài sổ sách kế toán.</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>