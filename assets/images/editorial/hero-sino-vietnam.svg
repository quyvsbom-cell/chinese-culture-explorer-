<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Giao lưu Văn hóa Trung - Việt: Tiếp nhận, Thích nghi và Bản sắc Độc lập</title>
  <desc>Three-layer Sinosphere comparative model highlighting shared classical traditions, Sino-Vietnamese localization, and independent Vietnamese cultural creation.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 11 • LỊCH SỬ SO SÁNH &amp; VÒNG VĂN HÓA CHỮ HÁN</text>
  <text x="72" y="138" class="h-title">Trung – Việt: Tiếp nhận Chủ động, Việt hóa Sâu sắc &amp; Bản sắc Nội sinh</text>
  <text x="72" y="172" class="h-sub">Âm Hán-Việt Đường–Tống • Sáng tạo Chữ Nôm • Thiền phái Trúc Lâm • Phố cổ Hội An</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <g transform="translate(72, 232)">
    <rect width="460" height="580" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.6"/>
    <text x="28" y="46" class="label-b">TẦNG 1: NGUỒN GIAO LƯU ĐÔNG Á</text>
    <text x="28" y="76" class="han" font-size="30" fill="#9F2929">汉字 • 儒佛道 • 科举</text>
    <text x="28" y="116" class="label-s">• Hệ chữ Hán cổ điển làm văn tự hành chính</text>
    <text x="28" y="146" class="label-s">• Định chế Nho học, Tứ Thư Ngũ Kinh &amp; Khoa cử</text>
    <text x="28" y="176" class="label-s">• Lịch pháp Âm–Dương và 24 Tiết khí</text>
    <text x="28" y="206" class="label-s">• Truyền thừa Thiền tông từ phương Bắc &amp; Ấn Độ</text>
    <rect x="28" y="246" width="404" height="296" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
    <text x="48" y="284" class="label-b">Ghi nhận Ngôn ngữ học (Nguyễn Tài Cẩn):</text>
    <text x="48" y="316" class="label-s">Tiếng Việt thuộc ngữ hệ Nam Á (không cùng họ</text>
    <text x="48" y="342" class="label-s">Hán-Tạng), nhưng tiếp thu lớp từ vựng Hán-Việt</text>
    <text x="48" y="368" class="label-s">trên cơ sở ngữ âm Trường An thời Vãn Đường</text>
    <text x="48" y="394" class="label-s">(bảo lưu phụ âm cuối -p, -t, -c trong độc lập,</text>
    <text x="48" y="420" class="label-s">hợp tác mà tiếng Phổ thông ngày nay đã rụng).</text>
  </g>

  <g transform="translate(568, 232)">
    <rect width="464" height="580" rx="8" fill="#FBF8F1" stroke="#637F72" stroke-width="2"/>
    <text x="28" y="46" class="label-b" fill="#3F574D">TẦNG 2: THÍCH NGHI &amp; BẢN ĐỊA HÓA</text>
    <text x="28" y="76" class="han" font-size="30" fill="#3F574D">三教同源 • 本土化</text>
    <text x="28" y="116" class="label-s">• “Tam giáo đồng nguyên”: Nho–Phật–Đạo hòa hợp</text>
    <text x="28" y="146" class="label-s">• Thiền phái Trúc Lâm Yên Tử nhập thế đời Trần</text>
    <text x="28" y="176" class="label-s">• Quốc triều Hình luật (Luật Hồng Đức) bảo vệ</text>
    <text x="28" y="206" class="label-s">  quyền thừa kế của phụ nữ khác luật Thanh</text>
    <rect x="28" y="246" width="408" height="296" rx="6" fill="#EEE9DE" stroke="#637F72"/>
    <text x="48" y="284" class="label-b">Thương cảng Phố cổ Hội An (XVI–XVIII):</text>
    <text x="48" y="316" class="label-s">Minh chứng sinh động về sự chung sống kinh tế:</text>
    <text x="48" y="344" class="label-s">nhà ống thương nhân Việt đan xen Hội quán</text>
    <text x="48" y="370" class="label-s">Phúc Kiến, Quảng Đông, Triều Châu &amp; Chùa Cầu.</text>
    <text x="48" y="410" class="label-b" fill="#9F2929">Lưu ý Học tiếng Trung (False Friends):</text>
    <text x="48" y="438" class="label-s">便宜 = Rẻ (TQ) vs Tiện nghi (VN)</text>
    <text x="48" y="464" class="label-s">学生 = Học sinh + Sinh viên (TQ) vs Phổ thông (VN)</text>
  </g>

  <g transform="translate(1068, 232)">
    <rect width="460" height="580" rx="8" fill="#9F2929" opacity="0.93"/>
    <text x="28" y="46" class="label-b" fill="#F7F4ED">TẦNG 3: SÁNG TẠO ĐỘC LẬP VIỆT NAM</text>
    <text x="28" y="78" class="han" font-size="30" fill="#E8D2A0">喃字 • 六八体 • 母道</text>
    <g transform="translate(28, 108)">
      <rect width="404" height="120" rx="6" fill="#F7F4ED"/><text x="20" y="34" class="label-b" fill="#9F2929">Chữ Nôm (喃字)</text><text x="20" y="64" class="label-s">Ghép bộ thủ Hán để ghi tiếng Việt thuần</text><text x="20" y="90" class="label-s">Đỉnh cao: Quốc Âm Thi Tập, Truyện Kiều</text>
      <rect y="140" width="404" height="120" rx="6" fill="#F7F4ED"/><text x="20" y="174" class="label-b" fill="#9F2929">Đình làng &amp; Thơ Lục bát</text><text x="20" y="204" class="label-s">Không gian đình làng mở &amp; điêu khắc dân gian</text><text x="20" y="230" class="label-s">Thể thơ Lục bát, Song thất lục bát bản địa</text>
      <rect y="280" width="404" height="146" rx="6" fill="#F7F4ED"/><text x="20" y="314" class="label-b" fill="#9F2929">Tín ngưỡng Thờ Mẫu &amp; Gốm Chu Đậu</text><text x="20" y="344" class="label-s">Thờ Thánh Mẫu bản địa (Tam/Tứ phủ)</text><text x="20" y="370" class="label-s">Bản sắc ẩm thực Tết lúa nước: Bánh chưng,</text><text x="20" y="396" class="label-s">nước mắm và mâm ngũ quả nhiệt đới</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>