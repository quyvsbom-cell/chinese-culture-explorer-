<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Triều Đường (618-907): Kinh đô Trường An và Thể chế Tam Tỉnh Lục Bộ</title>
  <desc>Architectural plan of Tang Chang&#x27;an&#x27;s 108 checkerboard wards alongside the Three Departments and Six Ministries administrative check-and-balance.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 07 • SỬ HỌC TRUNG ĐẠI • 618–907 SCN</text>
  <text x="72" y="138" class="h-title">Đại Đường Thịnh Thế: Quy hoạch Trường An &amp; Tam Tỉnh Lục Bộ</text>
  <text x="72" y="172" class="h-sub">Thủ đô 108 phường bàn cờ (~1 triệu dân), Đông-Tây Thị giao thương Á-Âu &amp; bước ngoặt 755</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Left: Chang'an Grid Plan -->
  <g transform="translate(72, 228)">
    <rect width="740" height="590" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.6"/>
    <text x="32" y="44" class="label-b">I. SƠ ĐỒ BÀN CỜ KINH ĐÔ TRƯỜNG AN (唐长安城 108 坊)</text>
    <text x="32" y="68" class="label-s">Kích thước 9,7 km × 8,6 km — tách biệt rõ khu hành chính Hoàng thành &amp; khu thương mại</text>
    <g transform="translate(115, 92)">
      <rect width="510" height="400" fill="#F7F4ED" stroke="#202020" stroke-width="3"/>
      <!-- Grid lines -->
      <path d="M85 0 V400 M170 0 V400 M255 0 V400 M340 0 V400 M425 0 V400 M0 80 H510 M0 160 H510 M0 240 H510 M0 320 H510" stroke="#C5BCA6" stroke-width="1.2"/>
      <!-- Central Axis Zhuque Avenue -->
      <rect x="242" y="120" width="26" height="280" fill="#B99A62" opacity="0.45"/>
      <text x="255" y="295" text-anchor="middle" class="label-s" font-weight="700" transform="rotate(-90 255 295)">Đại lộ Chu Tước (朱雀大街)</text>
      <!-- Palace City Top Center -->
      <rect x="170" y="0" width="170" height="120" fill="#9F2929" opacity="0.88" stroke="#202020" stroke-width="2"/>
      <text x="255" y="48" text-anchor="middle" class="han" font-size="24" fill="#F7F4ED">太极宫 • 皇城</text>
      <text x="255" y="82" text-anchor="middle" class="label-s" fill="#F7F4ED">Cung Thành &amp; Hoàng Thành</text>
      <!-- Daming Palace -->
      <rect x="305" y="-14" width="120" height="44" fill="#B63D32" stroke="#202020"/>
      <text x="365" y="14" text-anchor="middle" class="label-s" fill="#F7F4ED" font-weight="700">Đại Minh Cung</text>
      <!-- West Market & East Market -->
      <rect x="85" y="160" width="85" height="80" fill="#637F72" opacity="0.82"/>
      <text x="127" y="196" text-anchor="middle" class="han" font-size="20" fill="#F7F4ED">西市</text>
      <text x="127" y="220" text-anchor="middle" font-size="11" fill="#F7F4ED">Tây Thị (Ba Tư/Tơ lụa)</text>

      <rect x="340" y="160" width="85" height="80" fill="#637F72" opacity="0.82"/>
      <text x="382" y="196" text-anchor="middle" class="han" font-size="20" fill="#F7F4ED">东市</text>
      <text x="382" y="220" text-anchor="middle" font-size="11" fill="#F7F4ED">Đông Thị (Nội địa)</text>
    </g>
    <text x="370" y="540" text-anchor="middle" class="label-s">Ảnh hưởng trực tiếp tới quy hoạch Bình An Kinh (Kyoto) &amp; Nại Lương (Nara) Nhật Bản</text>
  </g>

  <!-- Right: Three Departments & Turning Points -->
  <g transform="translate(848, 228)">
    <rect width="680" height="590" rx="8" fill="#FBF8F1" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="30" y="44" class="label-b">II. CƠ CHẾ KIỂM TRA CHÉO “TAM TỈNH LỤC BỘ” (三省六部)</text>
    <g transform="translate(32, 74)">
      <rect x="195" y="0" width="230" height="48" rx="6" fill="#202020"/><text x="310" y="30" text-anchor="middle" class="label-b" fill="#B99A62">HOÀNG ĐẾ (Trinh Quán / Khai Nguyên)</text>
      <line x1="310" y1="48" x2="100" y2="84" stroke="#9F2929" stroke-width="2" marker-end="url(#arrowRed)"/>
      <line x1="310" y1="48" x2="310" y2="84" stroke="#9F2929" stroke-width="2" marker-end="url(#arrowRed)"/>
      <line x1="310" y1="48" x2="520" y2="84" stroke="#9F2929" stroke-width="2" marker-end="url(#arrowRed)"/>

      <rect x="0" y="90" width="190" height="92" rx="6" fill="#EEE9DE" stroke="#9F2929"/>
      <text x="95" y="122" text-anchor="middle" class="label-b" fill="#9F2929">Trung Thư Tỉnh</text>
      <text x="95" y="148" text-anchor="middle" class="label-s">Khởi thảo chính sách</text>

      <rect x="215" y="90" width="190" height="92" rx="6" fill="#EEE9DE" stroke="#B99A62"/>
      <text x="310" y="122" text-anchor="middle" class="label-b">Môn Hạ Tỉnh</text>
      <text x="310" y="148" text-anchor="middle" class="label-s">Thẩm định &amp; Bác bỏ</text>
      <text x="310" y="170" text-anchor="middle" font-size="12" fill="#9F2929">(Quyền Phong bác 封驳)</text>

      <rect x="430" y="90" width="190" height="92" rx="6" fill="#EEE9DE" stroke="#637F72"/>
      <text x="525" y="122" text-anchor="middle" class="label-b" fill="#3F574D">Thượng Thư Tỉnh</text>
      <text x="525" y="148" text-anchor="middle" class="label-s">Điều hành 6 Bộ thực thi</text>

      <rect x="0" y="208" width="620" height="58" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
      <text x="310" y="242" text-anchor="middle" class="label-s" font-weight="700">Lục Bộ: Lại (Nhân sự) • Hộ (Tài chính) • Lễ (Nghi lễ/Thi cử) • Binh • Hình • Công</text>

      <rect x="0" y="286" width="620" height="196" rx="6" fill="#EEE9DE" stroke="#B99A62"/>
      <text x="20" y="320" class="label-b">Các Cột mốc Bước ngoặt:</text>
      <text x="20" y="352" class="label-s">• 653 SCN: 《Đường Luật Sơ Nghị》 — bộ luật cổ hoàn chỉnh còn tồn tại</text>
      <text x="20" y="382" class="label-s">• 755–763: Loạn An Sử chuyển trọng tâm kinh tế về vùng Giang Nam</text>
      <text x="20" y="412" class="label-s">• 780: Cải cách Lưỡng Thuế của Dương Viêm giải phóng thương mại tư nhân</text>
      <text x="20" y="442" class="label-s">• Kết nối Việt Nam: Khương Công Phụ (Ái Châu) đỗ Tiến sĩ &amp; làm Tể tướng triều Đường</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>