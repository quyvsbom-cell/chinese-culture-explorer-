<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Chuỗi Cung ứng Xuyên biên giới Trung – Việt &amp; Kỷ nguyên RCEP</title>
  <desc>Supply chain flowchart mapping Chinese industrial clusters through smart land border gates and maritime corridors into Vietnam manufacturing and RCEP markets.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 38px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 13.5px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="84" class="kicker">CHƯƠNG 18 • CHUỖI CUNG ỨNG QUỐC TẾ • HẢI QUAN &amp; LOGISTICS TRUNG – VIỆT</text>
  <text x="72" y="132" class="h-title">Hành lang Cung ứng Trung – Việt: Từ Cụm Công nghiệp C2M tới Cửa khẩu Thông minh</text>
  <text x="72" y="164" class="h-sub">Tối ưu chi phí logistics đa phương thức, quy tắc xuất xứ ACFTA (C/O Form E) và chuyển dịch chuỗi giá trị RCEP</text>
  <line x1="72" y1="186" x2="1528" y2="186" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Column 1: China Industrial Clusters -->
  <g transform="translate(72, 222)">
    <rect width="390" height="545" rx="8" fill="#F2EDE1" stroke="#9F2929" stroke-width="1.8"/>
    <rect width="390" height="50" rx="8" fill="url(#redGrad)"/>
    <text x="195" y="31" text-anchor="middle" class="label-b" fill="#F7F4ED">1. VÀNH ĐAI CÔNG NGHIỆP (产业带)</text>

    <g transform="translate(22, 74)">
      <rect width="346" height="96" rx="6" fill="#FAF7F0" stroke="#DED8CA"/>
      <text x="16" y="28" class="label-b" fill="#9F2929">Thâm Quyến – Đông Quản (Quảng Đông)</text>
      <text x="16" y="54" class="label-s">• Linh kiện điện tử, bảng mạch PCB, gia công CNC</text>
      <text x="16" y="76" class="label-s">• Kết nối trực tiếp cụm sản xuất Bắc Ninh – Hải Phòng</text>
    </g>
    <g transform="translate(22, 188)">
      <rect width="346" height="96" rx="6" fill="#FAF7F0" stroke="#DED8CA"/>
      <text x="16" y="28" class="label-b" fill="#9F2929">Nghĩa Ô – Hàng Châu – Thiệu Hưng</text>
      <text x="16" y="54" class="label-s">• Dệt may, sợi vải, tiểu hàng hóa C2M qua 1688</text>
      <text x="16" y="76" class="label-s">• Cung ứng nguyên phụ liệu may mặc &amp; da giày VN</text>
    </g>
    <g transform="translate(22, 302)">
      <rect width="346" height="96" rx="6" fill="#FAF7F0" stroke="#DED8CA"/>
      <text x="16" y="28" class="label-b" fill="#9F2929">Phật Sơn – Sơn Đông – Thanh Đảo</text>
      <text x="16" y="54" class="label-s">• Máy móc công nghiệp, thiết bị gia dụng, vật liệu mới</text>
      <text x="16" y="76" class="label-s">• Cảng Ninh Ba – Chu Sơn &amp; Thâm Quyến Nam Sa</text>
    </g>
    <g transform="translate(22, 416)">
      <rect width="346" height="104" rx="6" fill="#EFECE2" stroke="#B99A62"/>
      <text x="16" y="28" class="label-b">Tiêu chuẩn Chứng từ Nguồn:</text>
      <text x="16" y="52" class="label-s">Sales Contract • Commercial Invoice • Packing List</text>
      <text x="16" y="74" class="label-s">C/O Form E (CCPITS/Hải quan GACC) giảm thuế 0%</text>
      <text x="16" y="94" class="label-s">Mã HS 8 số chuẩn hóa giữa hai cơ quan hải quan</text>
    </g>
  </g>

  <!-- Arrows Column 1 -> Column 2 -->
  <path d="M466 340 H548" stroke="#9F2929" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <path d="M466 490 H548" stroke="#B99A62" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  <path d="M466 640 H548" stroke="#637F72" stroke-width="3.5" marker-end="url(#arrowJade)"/>

  <!-- Column 2: Multimodal Cross-Border Gateways -->
  <g transform="translate(556, 222)">
    <rect width="468" height="545" rx="8" fill="#EFECE2" stroke="#B99A62" stroke-width="1.8"/>
    <rect width="468" height="50" rx="8" fill="url(#goldGrad)"/>
    <text x="234" y="31" text-anchor="middle" class="label-b" fill="#202020">2. HÀNH LANG CỬA KHẨU &amp; VẬN TẢI ĐA PHƯƠNG THỨC</text>

    <g transform="translate(24, 74)">
      <rect width="420" height="132" rx="6" fill="#FAF7F0" stroke="#9F2929" stroke-width="1.4"/>
      <text x="18" y="30" class="label-b" fill="#9F2929">A. Tuyến Bộ &amp; Đường sắt Hữu Nghị Quan – Bằng Tường</text>
      <text x="18" y="56" class="label-s">• Tốc độ nhanh (1–3 ngày từ Thâm Quyến tới Hà Nội)</text>
      <text x="18" y="80" class="label-s">• Cửa khẩu thông minh không tiếp xúc &amp; chuyển tải container</text>
      <text x="18" y="104" class="label-s">• Phù hợp linh kiện điện tử giá trị cao, hàng gấp &amp; nông sản lạnh</text>
    </g>

    <g transform="translate(24, 224)">
      <rect width="420" height="132" rx="6" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.4"/>
      <text x="18" y="30" class="label-b" fill="#7B5C24">B. Tuyến Tây: Côn Minh – Hà Khẩu – Lào Cai</text>
      <text x="18" y="56" class="label-s">• Kết nối vùng Tây Nam Trung Quốc (Vân Nam – Tứ Xuyên)</text>
      <text x="18" y="80" class="label-s">• Trung chuyển hóa chất, phân bón, quặng &amp; trái cây nhiệt đới</text>
      <text x="18" y="104" class="label-s">• Dự án kết nối khổ đường sắt tiêu chuẩn 1435mm</text>
    </g>

    <g transform="translate(24, 374)">
      <rect width="420" height="146" rx="6" fill="#FAF7F0" stroke="#637F72" stroke-width="1.6"/>
      <text x="18" y="30" class="label-b" fill="#2D4A3E">C. Hải vận Đông Hải / Biển Đông: Cảng Lạch Huyện &amp; Cái Mép</text>
      <text x="18" y="56" class="label-s">• Chi phí đơn vị thấp nhất cho hàng nặng, FCL (Container 20'/40')</text>
      <text x="18" y="80" class="label-s">• Tuyến Thượng Hải / Ninh Ba / Xà Khẩu → Hải Phòng / TP.HCM (4–8 ngày)</text>
      <text x="18" y="104" class="label-s">• Khai báo VNACCS/VCIS trước tàu cập cảng, kiểm tra B/L &amp; E-Manifest</text>
    </g>
  </g>

  <!-- Arrows Column 2 -> Column 3 -->
  <path d="M1028 490 H1108" stroke="#2D4A3E" stroke-width="4" marker-end="url(#arrowJade)"/>

  <!-- Column 3: Vietnam Value Chain & RCEP Hub -->
  <g transform="translate(1116, 222)">
    <rect width="412" height="545" rx="8" fill="#EAEFEF" stroke="#637F72" stroke-width="1.8"/>
    <rect width="412" height="50" rx="8" fill="url(#jadeGrad)"/>
    <text x="206" y="31" text-anchor="middle" class="label-b" fill="#F7F4ED">3. VIỆT NAM &amp; CHUỖI GIÁ TRỊ RCEP</text>

    <g transform="translate(22, 74)">
      <rect width="368" height="145" rx="6" fill="#FAF7F0" stroke="#DED8CA"/>
      <text x="18" y="30" class="label-b" fill="#2D4A3E">Chế biến – Lắp ráp – Nâng Hàm lượng</text>
      <text x="18" y="56" class="label-s">• Nhập bán thành phẩm/vật tư qua Form E</text>
      <text x="18" y="80" class="label-s">• Gia tăng giá trị nội địa đạt chuẩn RVC/CTC</text>
      <text x="18" y="104" class="label-s">• Tái xuất sang Mỹ, EU (EVFTA), Nhật (CPTPP)</text>
    </g>

    <g transform="translate(22, 238)">
      <rect width="368" height="145" rx="6" fill="#FAF7F0" stroke="#DED8CA"/>
      <text x="18" y="30" class="label-b" fill="#9F2929">Xuất khẩu Nông sản &amp; Chiều ngược lại</text>
      <text x="18" y="56" class="label-s">• Sầu riêng, thanh long, gạo, cà phê, cao su</text>
      <text x="18" y="80" class="label-s">• Bắt buộc mã số vùng trồng &amp; kiểm dịch GACC</text>
      <text x="18" y="104" class="label-s">• Xuất khẩu chính ngạch thay thế tiểu ngạch rủi ro</text>
    </g>

    <g transform="translate(22, 402)">
      <rect width="368" height="118" rx="6" fill="#F7F4ED" stroke="#637F72"/>
      <text x="18" y="28" class="label-b">Quản trị Rủi ro Thương mại:</text>
      <text x="18" y="52" class="label-s">• Sai lệch dữ liệu Invoice vs B/L vs C/O Form E</text>
      <text x="18" y="74" class="label-s">• Thẩm định xuất xứ tránh điều tra lẩn tránh</text>
      <text x="18" y="96" class="label-s">• Chọn điều kiện Incoterms 2020 phù hợp</text>
    </g>
  </g>

  <rect x="72" y="786" width="1320" height="52" rx="6" fill="#F7F4ED" stroke="#DED8CA"/>
  <text x="94" y="818" class="label-s"><tspan font-weight="700" fill="#202020">Khung phân tích Sinh viên Ngoại thương:</tspan> Kết hợp năng lực đọc chứng từ Hán ngữ chuyên ngành (报关单, 原产地证) với chuẩn hải quan điện tử VNACCS/VCIS &amp; RCEP.</text>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>