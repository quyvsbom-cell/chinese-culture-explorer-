<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Bản đồ So sánh Các Điểm Nút Thương mại Lục địa và Hàng hải Cổ đại</title>
  <desc>Schematic comparison map contrasting oasis caravan terminals, monsoon maritime Shibosi hubs, and key Southeast Asian transshipment ports.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 38px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 13.5px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1160" height="710" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="694" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="58" y="76" class="kicker">BẢN ĐỒ LỊCH SỬ • PHÂN BỐ ĐIỂM NÚT GIAO THƯƠNG ĐÔNG – TÂY</text>
  <text x="58" y="118" class="h-title" font-size="32">Chuyển dịch Trọng tâm Từ Lục địa sang Hải lộ (Thế kỷ II TCN – XVI SCN)</text>
  <line x1="58" y1="138" x2="1142" y2="138" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Cartographic Grid Canvas -->
  <g transform="translate(58, 160)">
    <rect width="1084" height="410" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.5"/>
    <!-- Latitude/Longitude stylized lines -->
    <path d="M0 100 H1084 M0 205 H1084 M0 310 H1084 M220 0 V410 M460 0 V410 M700 0 V410 M910 0 V410" stroke="#E7E1D3" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Stylized Landmass / Sea Division -->
    <path d="M50 35 L780 35 L950 75 L965 160 L875 235 L770 250 L690 295 L605 245 L495 275 L385 240 L265 280 L145 240 L50 265 Z" fill="#EFE8D7" stroke="#C5B99E" stroke-width="1.8"/>
    <rect x="680" y="255" width="380" height="145" rx="8" fill="url(#dotPattern)" opacity="0.55"/>

    <!-- Overland Paths (Red Dashed) -->
    <path d="M880 120 L690 102 L475 95 L260 112 L95 130" fill="none" stroke="#9F2929" stroke-width="3.8" stroke-dasharray="9 5" marker-end="url(#arrowRed)"/>
    <text x="480" y="72" text-anchor="middle" class="label-b" fill="#9F2929">Tuyến Lục địa: Lạc đà &amp; Ốc đảo (Hành lang Hà Tây — Trung Á — Ba Tư)</text>

    <!-- Maritime Paths (Jade Solid) -->
    <path d="M930 165 Q875 275 745 315 T445 335 T140 310" fill="none" stroke="#2D4A3E" stroke-width="4" marker-end="url(#arrowJade)"/>
    <text x="530" y="382" text-anchor="middle" class="label-b" fill="#2D4A3E">Hải lộ Gió mùa (Thủy triều &amp; Gió Tín phong): Cảng Thị Bạc Tư — Biển Đông — Ấn Độ Dương</text>

    <!-- City / Node markers -->
    <circle cx="880" cy="120" r="9" fill="#9F2929" stroke="#F7F4ED" stroke-width="2"/>
    <text x="880" y="144" text-anchor="middle" class="label-s" font-weight="700">Trường An (长安)</text>

    <circle cx="690" cy="102" r="8" fill="#9F2929" stroke="#F7F4ED" stroke-width="2"/>
    <text x="690" y="124" text-anchor="middle" class="label-s" font-weight="700">Đôn Hoàng</text>

    <circle cx="475" cy="95" r="8" fill="#9F2929" stroke="#F7F4ED" stroke-width="2"/>
    <text x="475" y="120" text-anchor="middle" class="label-s" font-weight="700">Samarkand</text>

    <circle cx="260" cy="112" r="8" fill="#9F2929" stroke="#F7F4ED" stroke-width="2"/>
    <text x="260" y="138" text-anchor="middle" class="label-s" font-weight="700">Baghdad / Ba Tư</text>

    <!-- Maritime Nodes -->
    <rect x="921" y="156" width="18" height="18" rx="3" fill="#2D4A3E" stroke="#F7F4ED" stroke-width="2"/>
    <text x="955" y="168" class="label-s" font-weight="700">Tuyền Châu / Quảng Châu</text>

    <rect x="782" y="255" width="18" height="18" rx="3" fill="#B99A62" stroke="#202020" stroke-width="1.8"/>
    <text x="808" y="280" class="label-s" font-weight="700" fill="#9F2929">Vân Đồn / Hội An (Đại Việt)</text>

    <rect x="572" y="318" width="18" height="18" rx="3" fill="#2D4A3E" stroke="#F7F4ED" stroke-width="2"/>
    <text x="580" y="308" text-anchor="middle" class="label-s" font-weight="700">Malacca</text>

    <rect x="335" y="318" width="18" height="18" rx="3" fill="#2D4A3E" stroke="#F7F4ED" stroke-width="2"/>
    <text x="344" y="308" text-anchor="middle" class="label-s" font-weight="700">Calicut (Ấn Độ)</text>

    <rect x="130" y="300" width="18" height="18" rx="3" fill="#2D4A3E" stroke="#F7F4ED" stroke-width="2"/>
    <text x="140" y="286" text-anchor="middle" class="label-s" font-weight="700">Hormuz / Đông Phi</text>
  </g>

  <!-- Bottom Analytical Legend -->
  <g transform="translate(58, 590)">
    <rect width="1084" height="114" rx="8" fill="#EFECE2" stroke="#DED8CA"/>
    <text x="24" y="32" class="label-b">Vì sao Hải lộ vươn lên thay thế Lục lộ từ thời Tống – Minh?</text>
    <text x="24" y="60" class="label-s">1. Công suất vận tải: 1 thương thuyền Phúc Kiến chở lượng hàng gốm sứ – tơ lụa tương đương hàng trăm lạc đà mà không tốn cỏ nước.</text>
    <text x="24" y="84" class="label-s">2. An ninh &amp; Thuế: Lục lộ phụ thuộc an ninh thảo nguyên Trung Á; hải cảng Thị Bạc Tư (Đường–Tống–Nguyên) cung cấp nguồn thuế ổn định.</text>
  </g>

  <g transform="translate(1055, 658)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>