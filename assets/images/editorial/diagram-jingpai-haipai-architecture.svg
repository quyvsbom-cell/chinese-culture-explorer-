<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Mặt bằng Tứ Hợp Viện Bắc Kinh vs Phố Lý Lộng Thạch Khố Môn Thượng Hải</title>
  <desc>Architectural floor-plan comparison contrasting Beijing introverted Siheyuan courtyards with Shanghai Lilong Shikumen townhouses.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1160" height="710" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="694" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="56" y="76" class="kicker">MẶT BẰNG KIẾN TRÚC ĐÔ THỊ SO SÁNH</text>
  <text x="56" y="118" class="h-title" style="font-size:32px;">Tổ chức Không gian Cư trú: Tứ Hợp Viện vs Lý Lộng Thạch Khố Môn</text>
  <line x1="56" y1="138" x2="1144" y2="138" stroke="#DED8CA" stroke-width="1.5"/>
  <g transform="translate(56, 170)">
    <rect width="530" height="515" rx="8" fill="#EEE9DE" stroke="#9F2929" stroke-width="1.8"/>
    <text x="265" y="42" text-anchor="middle" class="label-b" fill="#9F2929">TỨ HỢP VIỆN (四合院 – BẮC KINH)</text>
    <rect x="95" y="80" width="340" height="290" fill="#F7F4ED" stroke="#202020" stroke-width="2.5"/>
    <rect x="135" y="95" width="260" height="58" fill="#9F2929"/><text x="265" y="130" text-anchor="middle" font-size="13" fill="#F7F4ED">Chính phòng (Đón nắng Nam)</text>
    <rect x="110" y="165" width="48" height="125" fill="#B99A62"/><rect x="372" y="165" width="48" height="125" fill="#B99A62"/>
    <rect x="172" y="168" width="186" height="120" fill="#EEE9DE" stroke="#637F72" stroke-dasharray="4 3"/><text x="265" y="232" text-anchor="middle" font-size="13">Sân trung tâm</text>
    <rect x="145" y="302" width="240" height="52" fill="#202020"/><text x="265" y="333" text-anchor="middle" font-size="13" fill="#F7F4ED">Đảo tọa &amp; Ngõ Hồ Đồng (胡同)</text>
    <text x="265" y="425" text-anchor="middle" class="label-s">Kín đáo hướng nội • Chắn bão cát &amp; gió rét mùa Đông • Gia tộc đa thế hệ</text>

    <rect x="558" width="530" height="515" rx="8" fill="#FBF8F1" stroke="#224C8A" stroke-width="1.8"/>
    <text x="823" y="42" text-anchor="middle" class="label-b" fill="#224C8A">THẠCH KHỐ MÔN (石库门 – THƯỢNG HẢI)</text>
    <rect x="653" y="80" width="340" height="290" fill="#EEE9DE" stroke="#224C8A" stroke-width="2.5"/>
    <rect x="678" y="95" width="290" height="65" fill="#224C8A" opacity="0.22" stroke="#224C8A"/><text x="823" y="132" text-anchor="middle" font-size="13">Khách đường (Thức ăn – Tiếp khách)</text>
    <rect x="748" y="175" width="150" height="65" fill="#F7F4ED" stroke="#637F72"/><text x="823" y="212" text-anchor="middle" font-size="12">Thiên tĩnh nhỏ lấy sáng</text>
    <rect x="678" y="255" width="290" height="55" fill="#9F2929"/><text x="823" y="288" text-anchor="middle" font-size="13" fill="#F7F4ED">Cổng vòm Đá (石门) mở ra Ngõ Lý Lộng (里弄)</text>
    <text x="823" y="425" text-anchor="middle" class="label-s">Mật độ đô thị cao • Phố liền kề kiểu Anh + Thiên tĩnh Giang Nam • Gia đình hạt nhân</text>
  </g>

  <g transform="translate(1055, 658)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>