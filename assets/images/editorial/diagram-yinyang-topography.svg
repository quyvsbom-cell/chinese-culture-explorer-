<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Tiến hóa Ngữ nghĩa Âm Dương qua 4 Giai đoạn Văn bản</title>
  <desc>Chronological conceptual flow tracking Yin-Yang evolution from solar orientation to Han political ideology.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1160" height="710" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="694" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="56" y="76" class="kicker">BIỂU ĐỒ KHÁI NIỆM • TIẾN HÓA NGỮ NGHĨA</text>
  <text x="56" y="118" class="h-title" style="font-size:32px;">Bốn Bước Tiến hóa Tư duy của Cặp Phạm trù Âm – Dương</text>
  <line x1="56" y1="138" x2="1144" y2="138" stroke="#DED8CA" stroke-width="1.5"/>

  <g transform="translate(56, 175)">
    <rect width="250" height="495" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.6"/>
    <circle cx="42" cy="42" r="18" fill="#B99A62"/><text x="42" y="48" text-anchor="middle" class="label-b">1</text>
    <text x="74" y="48" class="label-b">Thế kỷ X–VII TCN</text>
    <text x="22" y="96" class="han" font-size="24" fill="#202020">《诗经》 Địa hình</text>
    <text x="22" y="138" class="label-s">• Sườn bắc / bờ nam = Âm</text>
    <text x="22" y="168" class="label-s">• Sườn nam / bờ bắc = Dương</text>
    <text x="22" y="210" class="label-s">Hoàn toàn cụ thể theo độ</text>
    <text x="22" y="236" class="label-s">chiếu sáng Mặt Trời.</text>

    <rect x="278" width="250" height="495" rx="8" fill="#FBF8F1" stroke="#637F72" stroke-width="1.6"/>
    <circle cx="320" cy="42" r="18" fill="#637F72"/><text x="320" y="48" text-anchor="middle" class="label-b" fill="#F7F4ED">2</text>
    <text x="352" y="48" class="label-b">Thế kỷ VI–V TCN</text>
    <text x="300" y="96" class="han" font-size="24" fill="#3F574D">《左传》 Lục Khí</text>
    <text x="300" y="138" class="label-s">• Y sư Hòa dùng Âm–Dương</text>
    <text x="300" y="168" class="label-s">  giải thích sinh lý bệnh lý</text>
    <text x="300" y="210" class="label-s">• Chuyển từ mặt đất lên</text>
    <text x="300" y="236" class="label-s">  trạng thái khí (气) cơ thể</text>

    <rect x="556" width="250" height="495" rx="8" fill="#FBF8F1" stroke="#9F2929" stroke-width="1.6"/>
    <circle cx="598" cy="42" r="18" fill="#9F2929"/><text x="598" y="48" text-anchor="middle" class="label-b" fill="#F7F4ED">3</text>
    <text x="630" y="48" class="label-b">Chiến Quốc</text>
    <text x="578" y="96" class="han" font-size="24" fill="#9F2929">《易·系辞》 Đạo</text>
    <text x="578" y="138" class="label-s">• “Nhất âm nhất dương chi</text>
    <text x="578" y="168" class="label-s">  vị Đạo” — quy luật</text>
    <text x="578" y="210" class="label-s">• Hợp nhất với Đạo Đức Kinh:</text>
    <text x="578" y="236" class="label-s">  Xung khí dĩ vi hòa</text>

    <rect x="834" width="254" height="495" rx="8" fill="#202020"/>
    <circle cx="876" cy="42" r="18" fill="#B99A62"/><text x="876" y="48" text-anchor="middle" class="label-b">4</text>
    <text x="908" y="48" class="label-b" fill="#F7F4ED">Tây Hán (Đổng Trọng Thư)</text>
    <text x="856" y="96" class="han" font-size="24" fill="#E8D2A0">“阳尊阴卑”</text>
    <text x="856" y="138" class="label-s" fill="#F7F4ED">• Chính trị hóa &amp; thứ bậc</text>
    <text x="856" y="168" class="label-s" fill="#F7F4ED">• Bước ngoặt gây tranh luận</text>
    <text x="856" y="210" class="label-s" fill="#DED8CA">• Khác bản chất cân bằng</text>
    <text x="856" y="236" class="label-s" fill="#DED8CA">  ngang hàng thời Tiên Tần</text>

    <line x1="252" y1="260" x2="274" y2="260" stroke="#9F2929" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <line x1="530" y1="260" x2="552" y2="260" stroke="#9F2929" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <line x1="808" y1="260" x2="830" y2="260" stroke="#9F2929" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  </g>

  <g transform="translate(1055, 658)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>