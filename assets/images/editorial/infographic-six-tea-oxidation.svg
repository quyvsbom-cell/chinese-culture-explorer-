<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Quy trình Chế biến 6 Đại Trà hệ Trung Quốc</title>
  <desc>Visual process flowchart detailing the oxidation steps distinguishing Green, White, Yellow, Oolong, Black, and Dark Pu-erh teas.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1160" height="710" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="694" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="56" y="76" class="kicker">QUY TRÌNH CHẾ BIẾN • CÔNG NGHỆ THỦ CÔNG TRUYỀN THỐNG</text>
  <text x="56" y="118" class="h-title" style="font-size:32px;">Tại sao Một Loài Cây (Camellia sinensis) Tạo Ra 6 Loại Trà Khác Nhau?</text>
  <line x1="56" y1="138" x2="1144" y2="138" stroke="#DED8CA" stroke-width="1.5"/>
  <g transform="translate(56, 170)">
    <rect width="1088" height="515" rx="8" fill="#EEE9DE" stroke="#637F72" stroke-width="1.8"/>
    <rect x="30" y="32" width="1028" height="58" rx="6" fill="#637F72"/>
    <text x="544" y="68" text-anchor="middle" class="label-b" fill="#F7F4ED">ĐIỂM XUẤT PHÁT CHUNG: Hái lá tươi Camellia sinensis (杀青 / 萎凋 quyết định phân loại)</text>

    <g transform="translate(30, 120)">
      <rect width="156" height="360" rx="6" fill="#F7F4ED" stroke="#637F72" stroke-width="2"/><text x="78" y="34" text-anchor="middle" class="label-b" fill="#3F574D">LỤC TRÀ</text><text x="78" y="64" text-anchor="middle" font-size="13">1. Diệt men ngay</text><text x="78" y="92" text-anchor="middle" font-size="13">2. Vò tạo hình</text><text x="78" y="120" text-anchor="middle" font-size="13">3. Sấy khô</text><text x="78" y="210" text-anchor="middle" class="mono" font-size="14" fill="#3F574D">0–5% Oxy</text><text x="78" y="320" text-anchor="middle" font-size="12">Long Tỉnh</text>
      <rect x="174" width="156" height="360" rx="6" fill="#F7F4ED" stroke="#B99A62" stroke-width="2"/><text x="252" y="34" text-anchor="middle" class="label-b">BẠCH TRÀ</text><text x="252" y="64" text-anchor="middle" font-size="13">1. Phơi héo nắng</text><text x="252" y="92" text-anchor="middle" font-size="13">   (Không vò)</text><text x="252" y="120" text-anchor="middle" font-size="13">2. Sấy nhẹ</text><text x="252" y="210" text-anchor="middle" class="mono" font-size="14">10–20% Oxy</text><text x="252" y="320" text-anchor="middle" font-size="12">Ngân Châm</text>
      <rect x="348" width="156" height="360" rx="6" fill="#F7F4ED" stroke="#C79E3B" stroke-width="2"/><text x="426" y="34" text-anchor="middle" class="label-b">HOÀNG TRÀ</text><text x="426" y="64" text-anchor="middle" font-size="13">1. Diệt men</text><text x="426" y="92" text-anchor="middle" font-size="13">2. Ủ nóng ẩm</text><text x="426" y="120" text-anchor="middle" font-size="13">   (Muộn hoàng)</text><text x="426" y="210" text-anchor="middle" class="mono" font-size="14">~20% Oxy</text><text x="426" y="320" text-anchor="middle" font-size="12">Quân Sơn</text>
      <rect x="522" width="156" height="360" rx="6" fill="#F7F4ED" stroke="#3F574D" stroke-width="2"/><text x="600" y="34" text-anchor="middle" class="label-b" fill="#3F574D">Ô LONG</text><text x="600" y="64" text-anchor="middle" font-size="13">1. Lắc dập viền</text><text x="600" y="92" text-anchor="middle" font-size="13">2. Sao diệt men</text><text x="600" y="120" text-anchor="middle" font-size="13">3. Bồi lửa than</text><text x="600" y="210" text-anchor="middle" class="mono" font-size="14">25–75% Oxy</text><text x="600" y="320" text-anchor="middle" font-size="12">Thiết Quan Âm</text>
      <rect x="696" width="156" height="360" rx="6" fill="#F7F4ED" stroke="#9F2929" stroke-width="2"/><text x="774" y="34" text-anchor="middle" class="label-b" fill="#9F2929">HỒNG TRÀ</text><text x="774" y="64" text-anchor="middle" font-size="13">1. Vò nát mô lá</text><text x="774" y="92" text-anchor="middle" font-size="13">2. Ủ oxy hóa</text><text x="774" y="120" text-anchor="middle" font-size="13">   toàn phần</text><text x="774" y="210" text-anchor="middle" class="mono" font-size="14" fill="#9F2929">90%+ Oxy</text><text x="774" y="320" text-anchor="middle" font-size="12">Kỳ Môn</text>
      <rect x="870" width="158" height="360" rx="6" fill="#F7F4ED" stroke="#202020" stroke-width="2"/><text x="949" y="34" text-anchor="middle" class="label-b">HẮC TRÀ</text><text x="949" y="64" text-anchor="middle" font-size="13">1. Làm trà thô</text><text x="949" y="92" text-anchor="middle" font-size="13">2. Phun ẩm ủ</text><text x="949" y="120" text-anchor="middle" font-size="13">   vi sinh (Ốc đôi)</text><text x="949" y="210" text-anchor="middle" class="mono" font-size="14">Hậu vi sinh</text><text x="949" y="320" text-anchor="middle" font-size="12">Phổ Nhĩ Thục</text>
    </g>
  </g>

  <g transform="translate(1055, 658)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>