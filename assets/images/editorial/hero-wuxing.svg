<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Thuyết Ngũ Hành: Cơ chế Tương Sinh và Tương Khắc Động</title>
  <desc>Five Phases dynamic feedback infographic distinguishing relational phase transformation from static elements.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 04 • LỊCH SỬ KHOA HỌC CỔ ĐẠI &amp; NHẬN THỨC LUẬN</text>
  <text x="72" y="138" class="h-title">Ngũ Hành (五行): Năm Pha Vận động chứ không phải 5 Nguyên tố Tĩnh</text>
  <text x="72" y="172" class="h-sub">Từ thiên 《尚书·洪范》 đến mạng lưới phản hồi hai chiều Tương Sinh (相生) – Tương Khắc (相克)</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <!-- Left: Pentagon Generating / Restraining Diagram -->
  <g transform="translate(72, 228)">
    <rect width="740" height="590" rx="8" fill="#FBF8F1" stroke="#637F72" stroke-width="1.6"/>
    <text x="32" y="44" class="label-b">I. MẠNG LƯỚI PHẢN HỒI HAI CHIỀU (CÂN BẰNG HỆ THỐNG)</text>
    <g transform="translate(370, 315)">
      <!-- Generating Outer Ring -->
      <circle r="175" fill="none" stroke="#637F72" stroke-width="3" stroke-dasharray="10 5"/>
      <!-- Controlling Inner Star -->
      <polygon points="0,-175 103,142 -166,-54 166,-54 -103,142" fill="none" stroke="#9F2929" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Nodes -->
      <g transform="translate(0,-175)"><circle r="44" fill="#9F2929"/><text y="-4" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">火 Hỏa</text><text y="18" text-anchor="middle" font-size="12" fill="#F7F4ED">Viêm thượng</text></g>
      <g transform="translate(166,-54)"><circle r="44" fill="#B99A62"/><text y="-4" text-anchor="middle" class="han" font-size="22" fill="#202020" font-weight="700">土 Thổ</text><text y="18" text-anchor="middle" font-size="12" fill="#202020">Giá sắc</text></g>
      <g transform="translate(103,142)"><circle r="44" fill="#EEE9DE" stroke="#202020" stroke-width="2"/><text y="-4" text-anchor="middle" class="han" font-size="22" fill="#202020" font-weight="700">金 Kim</text><text y="18" text-anchor="middle" font-size="12" fill="#202020">Tòng cách</text></g>
      <g transform="translate(-103,142)"><circle r="44" fill="#224C8A"/><text y="-4" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">水 Thủy</text><text y="18" text-anchor="middle" font-size="12" fill="#F7F4ED">Nhuận hạ</text></g>
      <g transform="translate(-166,-54)"><circle r="44" fill="#637F72"/><text y="-4" text-anchor="middle" class="han" font-size="22" fill="#F7F4ED" font-weight="700">木 Mộc</text><text y="18" text-anchor="middle" font-size="12" fill="#F7F4ED">Khúc trực</text></g>
    </g>
    <text x="370" y="556" text-anchor="middle" class="label-s">Đường viền nét dài (xanh): Tương Sinh nuôi dưỡng • Ngôi sao nét đứt (đỏ): Tương Khắc kiềm chế</text>
  </g>

  <!-- Right: Matrix -->
  <g transform="translate(848, 228)">
    <rect width="680" height="590" rx="8" fill="#EEE9DE" stroke="#DED8CA" stroke-width="1.6"/>
    <text x="30" y="44" class="label-b">II. BẢN ĐỒ TƯƠNG ỨNG (CORRELATIVE THINKING)</text>
    <g transform="translate(28, 72)">
      <rect width="624" height="44" fill="#202020"/>
      <text x="20" y="28" class="label-s" fill="#F7F4ED" font-weight="700">Hành</text>
      <text x="125" y="28" class="label-s" fill="#F7F4ED" font-weight="700">Tính chất (Hồng Phạm)</text>
      <text x="320" y="28" class="label-s" fill="#F7F4ED" font-weight="700">Mùa / Phương</text>
      <text x="480" y="28" class="label-s" fill="#F7F4ED" font-weight="700">Tạng (Đông y)</text>

      <g transform="translate(0, 52)">
        <rect width="624" height="72" fill="#F7F4ED" stroke="#637F72"/><text x="20" y="42" class="label-b" fill="#3F574D">木 Mộc</text><text x="125" y="42" class="label-s">Uốn cong &amp; vươn thẳng</text><text x="320" y="42" class="label-s">Xuân • Đông</text><text x="480" y="42" class="label-s">Can (Gan)</text>
      </g>
      <g transform="translate(0, 132)">
        <rect width="624" height="72" fill="#F7F4ED" stroke="#9F2929"/><text x="20" y="42" class="label-b" fill="#9F2929">火 Hỏa</text><text x="125" y="42" class="label-s">Bốc lên &amp; tỏa nhiệt</text><text x="320" y="42" class="label-s">Hạ • Nam</text><text x="480" y="42" class="label-s">Tâm (Tim)</text>
      </g>
      <g transform="translate(0, 212)">
        <rect width="624" height="72" fill="#F7F4ED" stroke="#B99A62"/><text x="20" y="42" class="label-b">土 Thổ</text><text x="125" y="42" class="label-s">Gieo trồng &amp; thu hoạch</text><text x="320" y="42" class="label-s">Trưởng hạ • Trung</text><text x="480" y="42" class="label-s">Tỳ (Lách)</text>
      </g>
      <g transform="translate(0, 292)">
        <rect width="624" height="72" fill="#F7F4ED" stroke="#787266"/><text x="20" y="42" class="label-b">金 Kim</text><text x="125" y="42" class="label-s">Theo khuôn &amp; thu liễm</text><text x="320" y="42" class="label-s">Thu • Tây</text><text x="480" y="42" class="label-s">Phế (Phổi)</text>
      </g>
      <g transform="translate(0, 372)">
        <rect width="624" height="72" fill="#F7F4ED" stroke="#224C8A"/><text x="20" y="42" class="label-b" fill="#224C8A">水 Thủy</text><text x="125" y="42" class="label-s">Thấm xuống &amp; tàng trữ</text><text x="320" y="42" class="label-s">Đông • Bắc</text><text x="480" y="42" class="label-s">Thận</text>
      </g>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>