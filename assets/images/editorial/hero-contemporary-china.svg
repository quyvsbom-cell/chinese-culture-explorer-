<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Trung Quốc Đương đại: Hạ tầng Số, Chuỗi cung ứng và Làn sóng Quốc Triều</title>
  <desc>Visual journalism graphic covering Contemporary China&#x27;s high-speed rail integration, super-app digital retail, cross-border e-commerce, and Guochao revival.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 40px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="844" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="72" y="88" class="kicker">CHƯƠNG 14 • TRUNG QUỐC ĐƯƠNG ĐẠI &amp; KINH TẾ XÃ HỘI SỐ</text>
  <text x="72" y="138" class="h-title">Trung Quốc Đương đại: Siêu Hạ tầng Số, Nội Quyển &amp; Làn sóng Quốc Triều</text>
  <text x="72" y="172" class="h-sub">Từ mạng lưới Đường sắt Cao tốc &amp; Siêu ứng dụng thanh toán đến chuỗi cung ứng TMĐT và bản sắc Gen Z</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#DED8CA" stroke-width="1.5"/>

  <g transform="translate(72, 232)">
    <rect width="465" height="585" rx="8" fill="#FBF8F1" stroke="#224C8A" stroke-width="1.8"/>
    <text x="28" y="44" class="label-b" fill="#224C8A">1. HẠ TẦNG GIAO THÔNG &amp; SỐ HÓA</text>
    <rect x="28" y="70" width="409" height="145" rx="6" fill="#EEE9DE"/>
    <text x="48" y="112" class="mono" font-size="36" fill="#224C8A" font-weight="700">45.000+ km</text>
    <text x="48" y="146" class="label-b">Mạng Đường sắt Cao tốc (高铁)</text>
    <text x="48" y="176" class="label-s">Kết nối cụm siêu đô thị Bắc-Thượng-Quảng-Thành</text>
    <text x="48" y="198" class="label-s">rút ngắn thời gian kinh doanh liên vùng còn 2–5 giờ</text>

    <rect x="28" y="232" width="409" height="145" rx="6" fill="#EEE9DE"/>
    <text x="48" y="274" class="mono" font-size="32" fill="#3F574D" font-weight="700">Siêu Ứng dụng (Super-Apps)</text>
    <text x="48" y="308" class="label-s">WeChat / Alipay tích hợp định danh số, thanh toán QR,</text>
    <text x="48" y="336" class="label-s">hợp đồng điện tử, thuế &amp; giao vận giao trong ngày</text>

    <rect x="28" y="394" width="409" height="160" rx="6" fill="#202020"/>
    <text x="48" y="432" class="label-b" fill="#B99A62">Hàm ý Chuỗi cung ứng Quốc tế:</text>
    <text x="48" y="464" class="label-s" fill="#F7F4ED">• Cảng tự động Thượng Hải &amp; Ninh Ba (top thế giới)</text>
    <text x="48" y="494" class="label-s" fill="#F7F4ED">• TMĐT xuyên biên giới (跨境电商) 1688, Temu,</text>
    <text x="48" y="522" class="label-s" fill="#F7F4ED">  TikTok Shop gắn thẳng nhà máy Nghĩa Ô – Quảng Đông</text>
  </g>

  <g transform="translate(568, 232)">
    <rect width="465" height="585" rx="8" fill="#EEE9DE" stroke="#B99A62" stroke-width="1.8"/>
    <text x="28" y="44" class="label-b">2. TÂM LÝ XÃ HỘI THẾ HỆ TRẺ</text>
    <rect x="28" y="70" width="409" height="225" rx="6" fill="#F7F4ED" stroke="#9F2929"/>
    <text x="48" y="114" class="han" font-size="34" fill="#9F2929" font-weight="700">内卷 (Nội quyển)</text>
    <text x="48" y="150" class="label-b">Cạnh tranh cạn kiệt biên độ tăng trưởng</text>
    <text x="48" y="182" class="label-s">Khái niệm nhân học được giới trẻ TQ dùng mô tả</text>
    <text x="48" y="210" class="label-s">áp lực thi cao học (考研), thi công chức (考公)</text>
    <text x="48" y="238" class="label-s">và văn hóa làm việc “996” tại đô thị hạng nhất.</text>

    <rect x="28" y="314" width="409" height="240" rx="6" fill="#F7F4ED" stroke="#637F72"/>
    <text x="48" y="358" class="han" font-size="34" fill="#3F574D" font-weight="700">躺平 / 佛系 (Phản ứng đối trọng)</text>
    <text x="48" y="394" class="label-s">“Thảng bình” (giảm tiêu dùng phô trương, thoát khỏi</text>
    <text x="48" y="422" class="label-s">cuộc đua tiêu hao) song hành cùng trào lưu tìm việc tại</text>
    <text x="48" y="450" class="label-s">“Đô thị Hạng hai Mới” (Thành Đô, Hàng Châu, Vũ Hán)</text>
    <text x="48" y="478" class="label-s">nơi cân bằng giữa thu nhập công nghệ &amp; chi phí sống.</text>
  </g>

  <g transform="translate(1064, 232)">
    <rect width="464" height="585" rx="8" fill="#9F2929" opacity="0.93"/>
    <text x="28" y="44" class="label-b" fill="#F7F4ED">3. LÀN SÓNG “QUỐC TRIỀU” (国潮)</text>
    <text x="28" y="88" class="han" font-size="36" fill="#E8D2A0" font-weight="700">传统美学的当代复兴</text>
    <text x="28" y="124" class="label-s" fill="#F7F4ED">Sự trở lại của di sản văn hóa trong thiết kế tiêu dùng</text>
    <g transform="translate(28, 152)">
      <rect width="408" height="116" rx="6" fill="#F7F4ED"/>
      <text x="20" y="34" class="label-b" fill="#9F2929">Bảo tàng Cố Cung × Thiết kế Đương đại</text>
      <text x="20" y="64" class="label-s">Chuyển hóa họa tiết Thiên Lý Giang Sơn, ấn triện,</text>
      <text x="20" y="90" class="label-s">mỹ phẩm &amp; văn phòng phẩm di sản chinh phục Gen Z</text>

      <rect y="134" width="408" height="116" rx="6" fill="#F7F4ED"/>
      <text x="20" y="168" class="label-b" fill="#9F2929">Tân Thức Trà Ẩm (新式茶饮)</text>
      <text x="20" y="198" class="label-s">Chagee, Heytea dùng trà nguyên lá &amp; thẩm mỹ Tống–Đường</text>
      <text x="20" y="224" class="label-s">mở rộng chuỗi sang Việt Nam &amp; Đông Nam Á</text>

      <rect y="268" width="408" height="132" rx="6" fill="#F7F4ED"/>
      <text x="20" y="302" class="label-b" fill="#9F2929">Hán phục &amp; Đô thị Di sản Số</text>
      <text x="20" y="332" class="label-s">Phục hồi trang phục Tống/Minh tại Tây An, Tô Châu</text>
      <text x="20" y="358" class="label-s">kết hợp trò chơi &amp; điện ảnh giải mã cổ tích dân gian</text>
    </g>
  </g>

  <g transform="translate(1455, 808)">
    <rect width="104" height="50" rx="3" fill="#9F2929" opacity="0.92"/>
    <rect x="4" y="4" width="96" height="42" rx="2" fill="none" stroke="#F7F4ED" stroke-width="1" opacity="0.7"/>
    <text x="52" y="24" text-anchor="middle" class="han" font-size="14" fill="#F7F4ED" font-weight="700">中国文化探索</text>
    <text x="52" y="40" text-anchor="middle" class="mono" font-size="10" fill="#F7F4ED" opacity="0.9">CCE ARCHIVE</text>
  </g>
</svg>