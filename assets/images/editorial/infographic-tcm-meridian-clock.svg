<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Đồng hồ Sinh học 12 Canh giờ &amp; Tý Ngọ Lưu Chú trong Đông y</title>
  <desc>12 Two-Hour TCM Meridian Flow chart (Ziwu Liuzhu) showing traditional circadian rhythm guidance for sleep, diet, and mental focus.</desc>
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
      .sans { font-family: 'Be Vietnam Pro', 'Inter', 'Noto Sans SC', sans-serif; }
      .han { font-family: 'Noto Serif SC', 'Noto Serif TC', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .kicker { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #9F2929; text-transform: uppercase; }
      .h-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 38px; font-weight: 700; fill: #202020; }
      .h-sub { font-family: 'Be Vietnam Pro', sans-serif; font-size: 17px; fill: #524F49; }
      .label-b { font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 700; fill: #202020; }
      .label-s { font-family: 'Be Vietnam Pro', sans-serif; font-size: 13.5px; fill: #524F49; }
      .han-big { font-family: 'Noto Serif SC', serif; font-weight: 700; fill: #202020; }
    </style>
    <pattern id="paperGrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F7F4ED"/>
      <circle cx="14" cy="18" r="0.8" fill="#C9C0AD" opacity="0.35"/>
      <circle cx="42" cy="46" r="0.7" fill="#B8AF9B" opacity="0.3"/>
      <path d="M0 30 H60 M30 0 V60" stroke="#E5DEC9" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9F2929" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <pattern id="dotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#637F72" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9F2929"/>
      <stop offset="100%" stop-color="#B63D32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBB078"/>
      <stop offset="100%" stop-color="#9E8048"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#637F72"/>
      <stop offset="100%" stop-color="#3F574D"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9F2929"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B99A62"/>
    </marker>
    <marker id="arrowJade" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#637F72"/>
    </marker>
    <marker id="arrowInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#paperGrain)"/>
  <rect x="20" y="20" width="1160" height="710" fill="none" stroke="#DED8CA" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="694" fill="none" stroke="#B99A62" stroke-width="0.9" opacity="0.65"/>
  
  <text x="58" y="76" class="kicker">INFOGRAPHIC ĐÔNG Y • TÝ NGỌ LƯU CHÚ (子午流注) &amp; NHỊP SINH HỌC</text>
  <text x="58" y="118" class="h-title" font-size="32">Chu kỳ 12 Canh giờ (十二时辰) Phối hợp Tạng Tượng &amp; Sinh hoạt Hàng ngày</text>
  <line x1="58" y1="140" x2="1142" y2="140" stroke="#DED8CA" stroke-width="1.5"/>
  <g transform="translate(58, 165)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#9F2929" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#9F2929" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#9F2929">23:00–01:00 • Tý (子)</text><text x="14" y="60" class="label-b" font-size="17">Đởm kinh</text><text x="14" y="88" class="label-s">Ngủ sâu dưỡng Đởm</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(333, 165)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#9F2929" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#9F2929" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#9F2929">01:00–03:00 • Sửu (丑)</text><text x="14" y="60" class="label-b" font-size="17">Can kinh</text><text x="14" y="88" class="label-s">Lọc huyết &amp; phục hồi</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(608, 165)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">03:00–05:00 • Dần (寅)</text><text x="14" y="60" class="label-b" font-size="17">Phế kinh</text><text x="14" y="88" class="label-s">Phân bố Khí huyết</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(883, 165)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">05:00–07:00 • Mão (卯)</text><text x="14" y="60" class="label-b" font-size="17">Đại trường</text><text x="14" y="88" class="label-s">Thức dậy, uống nước ấm</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(58, 330)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#637F72" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#637F72" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#637F72">07:00–09:00 • Thìn (辰)</text><text x="14" y="60" class="label-b" font-size="17">Vị kinh</text><text x="14" y="88" class="label-s">Ăn sáng đủ dinh dưỡng</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(333, 330)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#637F72" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#637F72" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#637F72">09:00–11:00 • Tỵ (巳)</text><text x="14" y="60" class="label-b" font-size="17">Tỳ kinh</text><text x="14" y="88" class="label-s">Vận hóa &amp; tập trung trí óc</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(608, 330)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#9F2929" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#9F2929" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#9F2929">11:00–13:00 • Ngọ (午)</text><text x="14" y="60" class="label-b" font-size="17">Tâm kinh</text><text x="14" y="88" class="label-s">Chợp mắt trưa 15–20p</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(883, 330)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">13:00–15:00 • Mùi (未)</text><text x="14" y="60" class="label-b" font-size="17">Tiểu trường</text><text x="14" y="88" class="label-s">Hấp thu dưỡng chất</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(58, 495)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">15:00–17:00 • Thân (申)</text><text x="14" y="60" class="label-b" font-size="17">Bàng quang</text><text x="14" y="88" class="label-s">Học tập / uống trà thanh</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(333, 495)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">17:00–19:00 • Dậu (酉)</text><text x="14" y="60" class="label-b" font-size="17">Thận kinh</text><text x="14" y="88" class="label-s">Vận động nhẹ, giảm muối</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(608, 495)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#B99A62" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#B99A62" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#B99A62">19:00–21:00 • Tuất (戌)</text><text x="14" y="60" class="label-b" font-size="17">Tâm bào</text><text x="14" y="88" class="label-s">Thư giãn, đọc sách</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g><g transform="translate(883, 495)"><rect width="256" height="145" rx="8" fill="#FAF7F0" stroke="#637F72" stroke-width="1.6"/><rect width="256" height="32" rx="8" fill="#637F72" opacity="0.16"/><text x="14" y="21" class="mono" font-size="13" font-weight="700" fill="#637F72">21:00–23:00 • Hợi (亥)</text><text x="14" y="60" class="label-b" font-size="17">Tam tiêu</text><text x="14" y="88" class="label-s">Ngừng màn hình, chuẩn bị ngủ</text><line x1="14" y1="106" x2="242" y2="106" stroke="#E5DEC9"/><text x="14" y="128" class="label-s" font-size="12" fill="#746F65">Chu kỳ 12 Canh giờ (十二时辰)</text></g>
  <rect x="58" y="660" width="960" height="48" rx="6" fill="#EFECE2" stroke="#DED8CA"/>
  <text x="76" y="689" class="label-s"><tspan font-weight="700" fill="#9F2929">Đối chiếu Y học Hiện đại:</tspan> Đồng hồ Tử Ngọ phản ánh trực giác cổ đại về nhịp sinh học ngày–đêm (Circadian Rhythm), nhấn mạnh ngủ sớm trước 23h và ăn sáng đều đặn.</text>

