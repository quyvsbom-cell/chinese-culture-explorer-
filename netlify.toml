"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Block internal backend scripts, source configs, and server utilities from static CDN delivery
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scratch/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/Website/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/server.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

# Canonical redirect from legacy domain-less /index.html to clean root /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Flat pre-rendered SEO/OpenGraph pages (direct HTTP 200 OK with zero 301 trailing-slash redirect for Zalo/FB crawlers)
