"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Note: Explicit 1-to-1 clean-URL Open Graph rewrites (/chuyen-luan/*, /tinh-thanh/*,
# /quoc-hoa/*, /bao-tang/*, section pages, and security 404 blocks) live in the auto-generated
# root `_redirects` file produced by `scripts/generate_seo_files.py`. Having `_redirects` hold
# the ordered static rules prevents wildcard /* from shadowing pre-rendered seo_pages/*.html.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
